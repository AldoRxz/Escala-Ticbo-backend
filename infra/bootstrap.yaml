AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Ticbo deployment bootstrap. Deployed by hand once per AWS account (and again
  when this file changes):
  aws cloudformation deploy --template-file infra/bootstrap.yaml
  --stack-name ticbo-bootstrap --capabilities CAPABILITY_NAMED_IAM --profile ticbo.
  GitHub Actions authenticates through OIDC: no long-lived AWS keys exist anywhere.

Parameters:
  GitHubRepository:
    Type: String
    # Immutable subject format (owner@ownerId/name@repoId): a repository created
    # later under the same name cannot impersonate this one. See
    # gh api repos/<owner>/<repo>/actions/oidc/customization/sub
    Default: AldoRxz@102345294/Escala-Ticbo-backend@1404935718
    Description: OIDC subject prefix of the repository allowed to deploy.
  DeployBranch:
    Type: String
    Default: main
  AppPrefix:
    Type: String
    Default: ticbo-app
    AllowedPattern: '[a-z][a-z0-9-]*'
    Description: >-
      Prefix of the application's stacks and resources. Deliberately different
      from the bootstrap resources (ticbo-github-*, ticbo-cloudformation-exec), so
      application deployments can never modify the roles that deploy them.

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  # Lambda zips uploaded by `aws cloudformation package`; old ones expire.
  ArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'ticbo-deploy-artifacts-${AWS::AccountId}-${AWS::Region}'
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-artifacts
            Status: Enabled
            ExpirationInDays: 30

  ArtifactsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt ArtifactsBucket.Arn
              - !Sub '${ArtifactsBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # Daily logical backups of the Supabase database (.github/workflows/backup.yml).
  # Versioned, so an overwritten or deleted backup stays recoverable for 7 days.
  BackupsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'ticbo-db-backups-${AWS::AccountId}-${AWS::Region}'
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: keep-35-days
            Status: Enabled
            ExpirationInDays: 35
            NoncurrentVersionExpiration:
              NoncurrentDays: 7

  BackupsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BackupsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt BackupsBucket.Arn
              - !Sub '${BackupsBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # Ticket photos, CFDI XML and PDF, under accounts/<account_id>/. Private: the
  # API reads and writes with the Lambda role and hands files to members only.
  # Retained if the stack goes away: it is customer data.
  FilesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'ticbo-files-${AWS::AccountId}-${AWS::Region}'
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  FilesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FilesBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt FilesBucket.Arn
              - !Sub '${FilesBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # Ceiling for every role the application stacks create (e.g. the Lambda role):
  # whatever policies a template attaches, the role can do no more than this.
  WorkloadBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${AppPrefix}-workload-boundary'
      Description: Permissions boundary for roles created by Ticbo application stacks.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: Logs
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: '*'
          - Sid: Tracing
            Effect: Allow
            Action:
              - xray:PutTraceSegments
              - xray:PutTelemetryRecords
            Resource: '*'
          - Sid: Settings
            Effect: Allow
            Action:
              - ssm:GetParameter
              - ssm:GetParameters
            Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/ticbo/*'
          - Sid: Keys
            Effect: Allow
            Action:
              - kms:Decrypt
              - kms:Encrypt
              - kms:GenerateDataKey
            Resource: '*'
          - Sid: Queues
            Effect: Allow
            Action:
              - sqs:SendMessage
              - sqs:ReceiveMessage
              - sqs:DeleteMessage
              - sqs:ChangeMessageVisibility
              - sqs:GetQueueAttributes
            Resource: !Sub 'arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${AppPrefix}-*'
          - Sid: InvokeAppFunctions
            Effect: Allow
            Action: lambda:InvokeFunction
            Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AppPrefix}-*'
          # Customers' files only; no bucket settings. Listing lets S3 answer 404
          # (not 403) for a missing object.
          - Sid: Files
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
            Resource: !Sub '${FilesBucket.Arn}/accounts/*'
          - Sid: ListFiles
            Effect: Allow
            Action: s3:ListBucket
            Resource: !GetAtt FilesBucket.Arn

  # CloudFormation creates the application's resources with this role, never
  # with the GitHub role. It only touches resources named with AppPrefix.
  CloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ticbo-cloudformation-exec
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: manage-app-stacks
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Functions
                Effect: Allow
                Action: 'lambda:*'
                Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AppPrefix}-*'
              - Sid: EventSourceMappings
                Effect: Allow
                Action:
                  - lambda:CreateEventSourceMapping
                  - lambda:DeleteEventSourceMapping
                  - lambda:GetEventSourceMapping
                  - lambda:UpdateEventSourceMapping
                Resource: '*'
              - Sid: HttpApis
                Effect: Allow
                Action: 'apigateway:*'
                Resource: !Sub 'arn:aws:apigateway:${AWS::Region}::/*'
              - Sid: LogGroups
                Effect: Allow
                Action: 'logs:*'
                Resource:
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ticbo/${AppPrefix}-*'
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AppPrefix}-*'
              - Sid: DescribeLogGroups
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: '*'
              # Roles may only be created or granted policies with the boundary attached.
              - Sid: BoundedRoleWrites
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:AttachRolePolicy
                  - iam:PutRolePolicy
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/${AppPrefix}-*'
                Condition:
                  StringEquals:
                    iam:PermissionsBoundary: !Ref WorkloadBoundary
              - Sid: RoleLifecycle
                Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:DeleteRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:PassRole
                  - iam:DetachRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/${AppPrefix}-*'
              - Sid: Queues
                Effect: Allow
                Action: 'sqs:*'
                Resource: !Sub 'arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${AppPrefix}-*'
              - Sid: Schedules
                Effect: Allow
                Action: 'scheduler:*'
                Resource: !Sub 'arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/*/${AppPrefix}-*'
              - Sid: Alarms
                Effect: Allow
                Action:
                  - cloudwatch:PutMetricAlarm
                  - cloudwatch:DeleteAlarms
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:TagResource
                Resource: !Sub 'arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${AppPrefix}-*'
              - Sid: ReadArtifacts
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${ArtifactsBucket.Arn}/*'
              # With --role-arn, CloudFormation expands the SAM transform as this role.
              - Sid: ServerlessTransform
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub 'arn:aws:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31'

  # Assumed by the deploy workflow on pushes to the deploy branch only.
  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ticbo-github-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubRepository}:ref:refs/heads/${DeployBranch}'
      Policies:
        - PolicyName: deploy-app-stacks
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Stacks
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListStackResources
                Resource: !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppPrefix}-*/*'
              - Sid: ServerlessTransform
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub 'arn:aws:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31'
              - Sid: ValidateTemplates
                Effect: Allow
                Action: cloudformation:ValidateTemplate
                Resource: '*'
              - Sid: HandStacksToTheExecutionRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com
              - Sid: UploadArtifacts
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub '${ArtifactsBucket.Arn}/*'
              - Sid: ListArtifacts
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource: !GetAtt ArtifactsBucket.Arn
              - Sid: ReadProductionSettings
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/ticbo/prod/*'
              - Sid: DecryptSecureStrings
                Effect: Allow
                Action: kms:Decrypt
                Resource: '*'
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'

  # Assumed by the backup workflow: reads the owner URL, writes new backups.
  # It cannot list, read or delete backups.
  GitHubBackupRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ticbo-github-backup
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubRepository}:ref:refs/heads/${DeployBranch}'
      Policies:
        - PolicyName: write-backups
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadOwnerUrl
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/ticbo/prod/DATABASE_MIGRATION_URL'
              - Sid: DecryptSecureStrings
                Effect: Allow
                Action: kms:Decrypt
                Resource: '*'
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'
              - Sid: WriteBackups
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub '${BackupsBucket.Arn}/*'

Outputs:
  DeployRoleArn:
    Value: !GetAtt GitHubDeployRole.Arn
  BackupRoleArn:
    Value: !GetAtt GitHubBackupRole.Arn
  ExecutionRoleArn:
    Value: !GetAtt CloudFormationExecutionRole.Arn
  WorkloadBoundaryArn:
    Value: !Ref WorkloadBoundary
  ArtifactsBucketName:
    Value: !Ref ArtifactsBucket
  BackupsBucketName:
    Value: !Ref BackupsBucket
  FilesBucketName:
    Value: !Ref FilesBucket
